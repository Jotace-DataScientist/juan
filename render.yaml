databases:
  - name: gre-math-db
    plan: free
    databaseName: gre_math
    user: gre_math

services:
  - type: web
    name: gre-math-app
    runtime: node
    plan: free
    buildCommand: cd client && npm install && npm run build && cd ../server && npm install
    startCommand: cd server && npm run migrate && npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gre-math-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CORS_ORIGIN
        value: "*"
      - key: NODE_VERSION
        value: 20
